<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt · Zululand Conservation Trust</title>
<meta name="robots" content="noindex">
<style>
:root{--lime:#A6CE39;--ink:#131711;--muted:#6E7566;--line:#E3E6DB;--paper:#F6F7F2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 24px rgba(19,23,17,.08);width:100%;max-width:420px;padding:26px 22px}
.hd{text-align:center;margin-bottom:14px}
.hd img{height:52px;margin:0 auto 8px;display:block}
.hd h1{font-size:15px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.hd .ev{font-size:12.5px;color:var(--muted);margin-top:3px}
.meta{display:flex;justify-content:space-between;font-family:ui-monospace,Menlo,monospace;font-size:12px;border-top:1.5px dashed #aaa;border-bottom:1.5px dashed #aaa;padding:8px 2px;margin:10px 0}
.li{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
.li span:last-child{font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.tot{display:flex;justify-content:space-between;border-top:2.5px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:800;font-size:19px}
.pay{font-size:13px;margin-top:8px;color:#333}
.pay b{color:var(--ink)}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.5}
.band{height:6px;background:var(--lime);border-radius:999px;margin:14px 0 0}
.err{text-align:center;color:var(--muted);padding:30px 10px}
.err h2{color:var(--ink);font-size:17px;margin-bottom:8px}
</style>
</head>
